name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd compressor examples)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/imgcompress
